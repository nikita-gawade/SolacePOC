<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MailOps – Email Operations Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FB;--card:#fff;--navy:#102A43;--bd:#e1e8f0;--tx:#102A43;--mut:#5b6b7d;--sel:#e3eefc;--acc:#2b6cb0;--ok:#12805c;--bad:#c9362c;--warn:#b7791f;--info:#2b6cb0;--hov:#f0f5fb;--sh:0 1px 2px rgba(16,42,67,.06),0 4px 12px rgba(16,42,67,.04);box-sizing:border-box}
:root:not([data-theme=light]){color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0b1523;--card:#12233a;--navy:#0a1320;--bd:#243b57;--tx:#e6edf5;--mut:#93a4b8;--sel:#1b3556;--acc:#6aa7ee;--ok:#3ec79a;--bad:#f0746b;--warn:#e0b050;--info:#6aa7ee;--hov:#18304d;--sh:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0b1523;--card:#12233a;--navy:#0a1320;--bd:#243b57;--tx:#e6edf5;--mut:#93a4b8;--sel:#1b3556;--acc:#6aa7ee;--ok:#3ec79a;--bad:#f0746b;--warn:#e0b050;--info:#6aa7ee;--hov:#18304d;--sh:none}
*{box-sizing:inherit}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.side{position:fixed;inset:0 auto 0 0;width:232px;background:var(--navy);color:#cdd9e6;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 18px;display:flex;flex-direction:column;gap:4px;z-index:5}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:17px;padding:4px 10px 18px}
.logo i{width:28px;height:28px;border-radius:8px;background:#2b6cb0;display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;position:relative;transition:background .15s,color .15s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav[aria-current=page]{background:rgba(74,144,226,.2);color:#fff}
.nav[aria-current=page]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#6aa7ee}
.side small{margin-top:auto;padding:10px;color:#8da2b8;font-size:12px}
main{margin-left:232px;padding:24px 28px 40px;max-width:1500px}
.page{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
h1{font-size:22px;margin:0 0 2px;font-weight:600}h2{font-size:15px;margin:0;font-weight:600}.sub,.mut{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn,select,.search{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover,select:hover{background:var(--hov);border-color:var(--acc)}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.p:hover{background:#1c4263}
.filters{margin:16px 0}
.filters label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.note{font-size:12px;color:var(--mut);margin:0 0 14px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.k4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:820px){.side{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.side small,.logo{display:none}.nav[aria-current=page]::before{display:none}main{margin:0;padding:16px}.k4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:16px;min-width:0}
.kpi{cursor:pointer;text-align:left;width:100%;transition:border-color .15s,transform .15s;border-top:3px solid var(--c)}
.kpi:hover{border-color:var(--c);transform:translateY(-1px)}.kpi.on{outline:2px solid var(--c)}
.kpi .h{display:flex;justify-content:space-between;color:var(--mut)}
.kpi .h svg{color:var(--c)}.kpi .v{font-size:30px;font-weight:600;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--mut)}.up{color:var(--bad)}.dn{color:var(--ok)}
.Completed{--c:var(--ok)}.Failed{--c:var(--bad)}.Processing{--c:var(--warn)}.Total{--c:var(--info)}.Idle{--c:var(--warn)}.Inactive{--c:var(--mut)}.Active{--c:var(--ok)}.Elevated{--c:var(--bad)}
.b{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.leg{display:flex;gap:14px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--mut);font-size:10.5px}.chart .gl{stroke:var(--bd)}.chart .cur{stroke:var(--mut);stroke-dasharray:3 3;opacity:0}
.tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;padding:8px 10px;border-radius:8px;font-size:12px;display:none;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tip div{display:flex;gap:8px;align-items:center}.tip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-weight:500;color:var(--mut);font-size:12.5px}th button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font-weight:500}th button:hover{color:var(--tx)}
tbody tr{cursor:pointer;transition:background .12s}tbody tr:hover,tbody tr:focus-visible{background:var(--hov)}
td.m{max-width:340px;overflow:hidden;text-overflow:ellipsis}.n{font-variant-numeric:tabular-nums}
.search{min-width:240px}.pg{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px}
.empty{padding:36px;text-align:center;color:var(--mut)}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--bd),var(--hov),var(--bd));background-size:200% 100%;animation:sh 1.1s infinite;height:16px;margin:10px 0}@keyframes sh{to{background-position:-200% 0}}
.err{border-color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(10,19,32,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:19}.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .22s ease;z-index:20;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 24px}.dr.on{transform:none}
dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:10px 0}dt{color:var(--mut)}dd{margin:0;word-break:break-word}
.msg{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin:6px 0 16px;word-break:break-word}
.tl{list-style:none;padding:0;margin:8px 0;border-left:2px solid var(--bd)}
.tl li{padding:0 0 12px 14px;position:relative}.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c);border:2px solid var(--card)}
.tl li.cur{background:var(--sel);border-radius:6px;padding-top:4px;margin-left:6px;padding-left:8px}
.tl li.cur::before{left:-14px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.donut svg{width:140px;height:140px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<aside class="side" aria-label="Primary"><div class="logo"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></i>MailOps</div><div id="nav" style="display:contents"></div><small>Demonstration data only</small></aside>
<main id="app"></main><div class="ov" id="ov"></div><aside class="dr" id="dr" aria-label="Request log details" role="dialog"></aside><div class="tip" id="tip"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- data layer (swap for ApiService calling ASP.NET Core) ---------- */
let seed=11;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const NOW=Date.now(),H=36e5,INST=['WRK-01','WRK-02','WRK-03','WRK-04','WRK-05','WRK-06'];
const pick=a=>a[Math.floor(rnd()*a.length)];
const FAILS=[()=>`SMTP connection timed out after ${pick([20000,25000,30000])} ms (relay smtp-0${1+Math.floor(rnd()*3)})`,()=>`Template render failed: missing field "${pick(['FirstName','InvoiceNo','DueDate'])}"`,()=>`Recipient address rejected: invalid mailbox format`,()=>`Attachment size ${26+Math.floor(rnd()*20)} MB exceeds 25 MB limit`,()=>`Database deadlock detected; transaction was rolled back`];
const ApiService={logs:[],load(){const L=[];for(let i=0;i<1600;i++){const w=INST[Math.floor(rnd()*6)];let t=NOW-rnd()*336*H;if(w==='WRK-06'&&t>NOW-3*H)t-=3*H;const sr='SR-'+(48200+i),fl=w==='WRK-04'?.32:.07;const add=(s,m,tm)=>L.push({LogId:'LG-'+Math.floor(rnd()*4294967295).toString(16).padStart(8,'0'),Srno:sr,Status:s,InstanceId:w,Message:m,LogTime:tm});add('Processing','Request received and queued for processing',t);const r=rnd(),e=t+(2+rnd()*80)*1000;if(r<.012||(t>NOW-15*6e4&&r<.5)||e>NOW)continue;rnd()<fl?add('Failed',FAILS[Math.floor(rnd()**1.6*5)](),e):add('Completed','Processing completed successfully',e)}L.sort((a,b)=>a.LogTime-b.LogTime);L.forEach((l,i)=>l.Id=i+1);this.logs=L}};
ApiService.load();const LOGS=ApiService.logs,HIST={},LAST={};LOGS.forEach(l=>{(HIST[l.Srno]??=[]).push(l);LAST[l.Srno]=l});
/* ---------- state & helpers ---------- */
const S={page:'overview',range:24,status:'',inst:'',q:'',sk:'LogTime',sd:-1,pg:1,size:10,sel:null,loading:false,error:false,ts:Date.now(),grp:'',fi:''};
const fmt=t=>new Date(t).toISOString().replace('T',' ').slice(0,19),ago=t=>{const m=Math.round((NOW-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const cnt=a=>({C:a.filter(l=>l.Status==='Completed').length,P:a.filter(l=>l.Status==='Processing').length,F:a.filter(l=>l.Status==='Failed').length,n:a.length,req:new Set(a.map(l=>l.Srno)).size});
const inRange=(l,k=0)=>l.LogTime>=NOW-(k+1)*S.range*H&&l.LogTime<NOW-k*S.range*H&&(!S.inst||l.InstanceId===S.inst);
const base=()=>LOGS.filter(l=>inRange(l)),prev=()=>LOGS.filter(l=>inRange(l,1)),pc=(a,b)=>b?(a/b*100).toFixed(1)+'%':'0%';
const BH={6:.25,24:1,72:3,168:6,336:12};
const bucket=a=>{const bh=BH[S.range],n=S.range/bh,st=NOW-S.range*H,bk=Array.from({length:n},(_,i)=>({t:st+i*bh*H,C:0,P:0,F:0,T:0}));a.forEach(l=>{const i=Math.min(n-1,Math.floor((l.LogTime-st)/(bh*H)));const b=bk[i];b.T++;b[l.Status[0]]++});return bk};
const ic={mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',ok:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',clk:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',bad:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',ref:'<path d="M20 11a8 8 0 1 0-2 5.5M20 4v7h-7"/>'};
const I=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[n]}</svg>`;
const badge=s=>`<span class="b ${s}">${s}</span>`;
/* ---------- charts ---------- */
const CH={};
function chart(id,bk,ser,type){const W=640,Hh=210,L=34,R=8,T=8,B=22,n=bk.length;let mx=Math.max(1,...bk.map(b=>Math.max(...ser.map(s=>b[s.k]))));let st=Math.ceil(mx/4),mg=10**Math.floor(Math.log10(st));st=Math.ceil(st/mg)*mg;const top=st*4,y=v=>T+(Hh-T-B)*(1-v/top),sl=(W-L-R)/n,stp=(W-L-R)/(n-1),x=i=>type==='bar'?L+i*sl+sl/2:L+i*stp;CH[id]={bk,ser,W,L,sl,stp,n,type};const bh=BH[S.range];const lab=t=>{const s=new Date(t).toISOString();return bh<24?s.slice(11,16):s.slice(5,10)+' '+s.slice(11,13)+'h'};let g='';for(let k=0;k<=4;k++){g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(st*k)}" y2="${y(st*k)}"/><text x="${L-6}" y="${y(st*k)+3}" text-anchor="end">${st*k}</text>`}for(let k=0;k<5;k++){const i=Math.round(k*(n-1)/4);g+=`<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${lab(bk[i].t)}</text>`}let d='';if(type==='bar')ser.forEach(s=>bk.forEach((b,i)=>{const h=Hh-B-y(b[s.k]);d+=`<rect x="${x(i)-sl*.35}" y="${y(b[s.k])}" width="${sl*.7}" height="${h}" rx="2" style="fill:var(${s.c})" opacity=".85"/>`}));else ser.forEach(s=>d+=`<path d="${bk.map((b,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(b[s.k]).toFixed(1)).join('')}" fill="none" stroke-width="2" stroke-linejoin="round" style="stroke:var(${s.c})"/>`);return `<svg class="chart" data-c="${id}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${ser.map(s=>s.n).join(', ')} over time">${g}${d}<line class="cur" y1="${T}" y2="${Hh-B}"/></svg>`}
const leg=s=>`<div class="leg">${s.map(x=>`<span style="--c:var(${x.c})"><i></i>${x.n}</span>`).join('')}</div>`;
document.addEventListener('mousemove',e=>{const sv=e.target.closest?.('.chart'),tip=$('#tip');if(!sv){tip.style.display='none';return}const c=CH[sv.dataset.c],r=sv.getBoundingClientRect(),rel=(e.clientX-r.left)/r.width*c.W;let i=c.type==='bar'?Math.floor((rel-c.L)/c.sl):Math.round((rel-c.L)/c.stp);i=Math.max(0,Math.min(c.n-1,i));const b=c.bk[i],cx=c.type==='bar'?c.L+i*c.sl+c.sl/2:c.L+i*c.stp,cur=sv.querySelector('.cur');cur.setAttribute('x1',cx);cur.setAttribute('x2',cx);cur.style.opacity=1;tip.innerHTML=`<b>${fmt(b.t).slice(0,16)} UTC</b>`+c.ser.map(s=>`<div style="--c:var(${s.c})"><i></i>${s.n}: <b>${b[s.k]}</b></div>`).join('');tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-190)+'px';tip.style.top=e.clientY+14+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest?.('.chart')){e.target.closest('.chart').querySelector('.cur').style.opacity=0}});
function donut(c){const t=c.C+c.P+c.F||1,R=54,Cc=2*Math.PI*R;let o=0;const seg=[['Completed',c.C,'--ok'],['Processing',c.P,'--warn'],['Failed',c.F,'--bad']];return `<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="Status distribution">${seg.map(([n,v,col])=>{const l=v/t*Cc,s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke-width="16" style="stroke:var(${col})" stroke-dasharray="${l} ${Cc-l}" stroke-dashoffset="${-o}" transform="rotate(-90 70 70)"><title>${n}: ${v} (${pc(v,t)})</title></circle>`;o+=l;return s}).join('')}<text x="70" y="68" text-anchor="middle" style="fill:var(--tx);font-size:20px;font-weight:600">${t}</text><text x="70" y="84" text-anchor="middle" style="fill:var(--mut);font-size:11px">entries</text></svg><div>${seg.map(([n,v])=>`<div style="margin:6px 0">${badge(n)} <b class="n">${pc(v,t)}</b> <span class="mut n">(${v})</span></div>`).join('')}</div></div>`}
/* ---------- components ---------- */
function filters(){const o=(v,t,c)=>`<option value="${v}" ${String(c)===String(v)?'selected':''}>${t}</option>`;return `<div class="row filters"><label>Date range <select data-f="range">${[[6,'Last 6 hours'],[24,'Last 24 hours'],[72,'Last 3 days'],[168,'Last 7 days'],[336,'Last 14 days']].map(([v,t])=>o(v,t,S.range)).join('')}</select></label><label>Status <select data-f="status">${o('','All statuses',S.status)}${['Completed','Processing','Failed'].map(s=>o(s,s,S.status)).join('')}</select></label><label>Worker <select data-f="inst">${o('','All instances',S.inst)}${INST.map(s=>o(s,s,S.inst)).join('')}</select></label></div>`}
function head(t,sub){return `<div class="top"><div><h1>${t}</h1><div class="sub">${sub}</div></div><div class="row"><span class="mut" style="font-size:13px">Last refreshed ${fmt(S.ts)} UTC</span><button class="btn p" data-a="refresh">${I('ref',15)} Refresh</button></div></div>${filters()}<p class="note">Demonstration data. Counts are log entries unless noted; one request (Srno) can have several entries.</p>`}
function kpis(){const b=base(),p=prev(),c=cnt(b),q=cnt(p),open=b.filter(l=>l.Status==='Processing'&&LAST[l.Srno]===l),slow=open.filter(l=>NOW-l.LogTime>15*6e4).length,d=q.req?((c.req-q.req)/q.req*100):0,fd=c.F-q.F;const card=(k,ico,v,sub,cls,st)=>`<button class="card kpi ${cls} ${S.status===st&&S.page==='logs'?'on':''}" data-a="kpi" data-v="${st}"><div class="h"><span>${k}</span>${I(ico)}</div><div class="v">${v.toLocaleString()}</div><div class="s">${sub}</div></button>`;return `<div class="grid k4">${card('Total Requests','mail',c.req,`${c.n.toLocaleString()} log entries · <span class="${d>0?'dn':'up'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%</span> vs previous period`,'Total','')}${card('Completed','ok',c.C,`${pc(c.C,c.n)} of log entries`,'Completed','Completed')}${card('Processing','clk',c.P,`${open.length} unresolved · <span class="${slow?'up':''}">${slow} running over 15 min</span>`,'Processing','Processing')}${card('Failed','bad',c.F,`${pc(c.F,c.n)} failure rate · <span class="${fd>0?'up':'dn'}">${fd>0?'▲ +':'▼ '}${fd} vs previous</span>`,'Failed','Failed')}</div>`}
function rows(){let r=base().filter(l=>!S.status||l.Status===S.status);const q=S.q.trim().toLowerCase();if(q)r=r.filter(l=>[l.LogId,l.Srno,l.Message].some(v=>v.toLowerCase().includes(q)));const k=S.sk;r.sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*S.sd);return r}
function table(){if(S.loading)return `<div class="sk"></div>`.repeat(8);const r=rows(),pages=Math.max(1,Math.ceil(r.length/S.size));S.pg=Math.min(S.pg,pages);const v=r.slice((S.pg-1)*S.size,S.pg*S.size);const th=(k,t)=>`<th aria-sort="${S.sk===k?(S.sd>0?'ascending':'descending'):'none'}"><button data-a="sort" data-v="${k}">${t}${S.sk===k?(S.sd>0?' ↑':' ↓'):''}</button></th>`;return `<div class="tw"><table><thead><tr>${th('Id','Id')}${th('LogId','LogId')}${th('Srno','Srno')}${th('Status','Status')}${th('InstanceId','InstanceId')}<th>Message</th>${th('LogTime','LogTime (UTC)')}</tr></thead><tbody>${v.map(l=>`<tr tabindex="0" data-a="row" data-v="${l.Id}"><td class="n">${l.Id}</td><td>${l.LogId}</td><td>${l.Srno}</td><td>${badge(l.Status)}</td><td>${l.InstanceId}</td><td class="m" title="${esc(l.Message)}">${esc(l.Message)}</td><td class="n">${fmt(l.LogTime)}</td></tr>`).join('')}</tbody></table></div>${r.length?'':`<div class="empty"><b>No log entries match these filters.</b><br>Try a wider date range, clear the status filter, or change the search term.</div>`}<div class="pg"><span class="mut">${r.length.toLocaleString()} entries · page ${S.pg} of ${pages}</span><span class="row"><label class="mut">Rows <select data-f="size">${[10,25,50].map(n=>`<option ${n===S.size?'selected':''}>${n}</option>`).join('')}</select></label><button class="btn" data-a="pg" data-v="-1" ${S.pg<2?'disabled':''}>Previous</button><button class="btn" data-a="pg" data-v="1" ${S.pg>=pages?'disabled':''}>Next</button></span></div>`}
const logsCard=t=>`<div class="card"><div class="hd"><h2>${t}</h2><input class="search" data-f="q" type="search" placeholder="Search LogId, Srno or message" aria-label="Search logs" value="${esc(S.q)}"></div><div id="tbl">${table()}</div></div>`;
function drawer(){const l=LOGS[S.sel-1];if(!l){$('#dr').classList.remove('on');$('#ov').classList.remove('on');return}const h=HIST[l.Srno];$('#dr').innerHTML=`<div class="hd"><h2>Log entry ${l.LogId}</h2><button class="btn" data-a="close" id="cl" aria-label="Close details">Close</button></div><div class="mut" style="font-size:12.5px">This single log entry</div><dl><dt>Log ID</dt><dd>${l.LogId}</dd><dt>Request Srno</dt><dd>${l.Srno}</dd><dt>Recorded status</dt><dd>${badge(l.Status)}</dd><dt>Worker instance</dt><dd>${l.InstanceId}</dd><dt>Timestamp</dt><dd>${new Date(l.LogTime).toISOString()}</dd><dt>Log record Id</dt><dd>${l.Id}</dd></dl><div class="mut" style="font-size:12.5px">Full message</div><div class="msg">${esc(l.Message)}</div><h2>Request history</h2><div class="mut" style="font-size:12.5px">All ${h.length} log entries for ${l.Srno}, oldest first. Only recorded entries are shown.</div><ol class="tl">${h.map(x=>`<li class="${x.Status} ${x.Id===l.Id?'cur':''}">${badge(x.Status)} <span class="mut n">${fmt(x.LogTime)} · ${x.InstanceId}</span><div>${esc(x.Message)}</div></li>`).join('')}</ol>`;$('#dr').classList.add('on');$('#ov').classList.add('on');$('#cl').focus()}
/* ---------- pages ---------- */
function overview(){const b=base(),c=cnt(b),bk=bucket(b),S3=[{k:'C',n:'Completed',c:'--ok'},{k:'P',n:'Processing',c:'--warn'},{k:'F',n:'Failed',c:'--bad'}];return head('Email Operations Overview','Monitor email processing activity across all worker instances.')+kpis()+`<div class="grid g2" style="margin:14px 0"><div class="card"><div class="hd"><h2>Log entries by status</h2>${leg(S3)}</div>${chart('ts',bk,S3,'line')}</div><div class="card"><h2 style="margin-bottom:12px">Status distribution</h2>${donut(c)}</div></div><div class="card" style="margin-bottom:14px"><div class="hd"><h2>Processing activity</h2>${leg([{n:'All log entries',c:'--info'}])}</div>${chart('vol',bk,[{k:'T',n:'All log entries',c:'--info'}],'bar')}</div>`+logsCard('Recent email request logs')}
function workers(){const all=INST.filter(w=>!S.inst||w===S.inst);const rs=all.map(w=>{const a=LOGS.filter(l=>l.InstanceId===w),lst=a[a.length-1],b=base().filter(l=>l.InstanceId===w),c=cnt(b),h=a.filter(l=>l.LogTime>NOW-H),hf=h.filter(l=>l.Status==='Failed').length,age=NOW-lst.LogTime;const st=hf>=3&&hf/h.length>=.25?'Elevated':age<15*6e4?'Active':age<2*H?'Idle':'Inactive';return{w,lst,c,st}});const lbl={Elevated:'Elevated failures',Active:'Active',Idle:'Idle',Inactive:'No recent activity'};return head('Worker Instances','Activity per InstanceId, inferred from recent log entries.')+`<div class="card"><p class="note" style="margin-top:0">Health badges are <b>inferred from log activity</b> (last entry age, share of failures in the last hour). They are not heartbeat or health-check results.</p><div class="tw"><table><thead><tr><th>InstanceId</th><th>Inferred state</th><th>Last activity (UTC)</th><th>Entries</th><th>Completed</th><th>Failed</th><th>Processing</th><th>Last status</th></tr></thead><tbody>${rs.map(r=>`<tr data-a="wk" data-v="${r.w}" tabindex="0"><td><b>${r.w}</b></td><td><span class="b ${r.st}" title="Inferred from recent log activity">${lbl[r.st]}</span></td><td class="n">${fmt(r.lst.LogTime)} <span class="mut">(${ago(r.lst.LogTime)})</span></td><td class="n">${r.c.n}</td><td class="n">${r.c.C}</td><td class="n">${r.c.F}</td><td class="n">${r.c.P}</td><td>${badge(r.lst.Status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function failures(){const b=base(),f=b.filter(l=>l.Status==='Failed'),c=cnt(b),G={};f.forEach(l=>{const k=l.Message.replace(/"[^"]*"/g,'"…"').replace(/\d+/g,'#');(G[k]??={k,n:0,w:new Set(),last:0}).n++;G[k].w.add(l.InstanceId);G[k].last=Math.max(G[k].last,l.LogTime)});const gs=Object.values(G).sort((a,b)=>b.n-a.n),sel=f.filter(l=>!S.grp||l.Message.replace(/"[^"]*"/g,'"…"').replace(/\d+/g,'#')===S.grp).sort((a,b)=>b.LogTime-a.LogTime).slice(0,12),bk=bucket(f);const k=(t,v,s)=>`<div class="card Failed" style="border-top:3px solid var(--c)"><div class="mut">${t}</div><div class="v" style="font-size:28px;font-weight:600">${v}</div><div class="s mut">${s}</div></div>`;return head('Failure Analysis','Failed log entries grouped by message text. Root causes are not recorded in this table.')+`<div class="grid g3">${k('Failed log entries',f.length.toLocaleString(),'in selected range')}${k('Failure rate',pc(c.F,c.n),'failed ÷ all log entries')}${k('Distinct failure patterns',gs.length,'digits and quoted values normalised')}</div><div class="card" style="margin:14px 0"><div class="hd"><h2>Failure trend</h2>${leg([{n:'Failed',c:'--bad'}])}</div>${chart('ft',bk,[{k:'F',n:'Failed',c:'--bad'}],'bar')}</div><div class="grid g2" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Messages grouped by similar text</h2><div class="tw"><table style="min-width:420px"><tbody>${gs.map(g=>`<tr data-a="grp" data-v="${esc(g.k)}" tabindex="0" style="${S.grp===g.k?'background:var(--sel)':''}"><td style="white-space:normal">${esc(g.k)}</td><td class="n"><b>${g.n}</b></td><td class="mut">${g.w.size} worker${g.w.size>1?'s':''}</td></tr>`).join('')||'<tr><td class="empty">No failures in this range.</td></tr>'}</tbody></table></div>${S.grp?'<button class="btn" data-a="grp" data-v="" style="margin-top:8px">Clear group filter</button>':''}</div><div class="card"><h2>Recent failed requests</h2><div class="tw"><table style="min-width:420px"><tbody>${sel.map(l=>`<tr tabindex="0" data-a="row" data-v="${l.Id}"><td>${l.Srno}</td><td>${l.InstanceId}</td><td class="m" title="${esc(l.Message)}" style="max-width:200px">${esc(l.Message)}</td><td class="n mut">${ago(l.LogTime)}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function simple(t,sub,body){return `<div class="top"><div><h1>${t}</h1><div class="sub">${sub}</div></div></div><div class="card" style="margin-top:16px;max-width:680px">${body}</div>`}
const pages={overview,logs:()=>head('Email Request Logs','Search, sort and inspect every recorded log entry.')+kpis()+`<div style="height:14px"></div>`+logsCard('Log entries'),workers,failures,health:()=>simple('System Health','Service-level health needs real signals.','<p>The SQL log table cannot prove that a worker is alive. Connect heartbeat or health-check data from the ASP.NET Core API (for example a <b>WorkerHeartbeat</b> table) to show live status, queue depth and latency here.</p>'),settings:()=>simple('Settings','Prototype controls.',`<p>Use this to preview the error state of the dashboard.</p><button class="btn" data-a="err">Simulate API error</button> <button class="btn" data-a="theme">Toggle dark theme</button>`)};
const NAV=[['overview','Overview'],['logs','Email Request Logs'],['workers','Worker Instances'],['failures','Failure Analysis'],['health','System Health'],['settings','Settings']];
function render(){$('#nav').innerHTML=NAV.map(([k,t])=>`<button class="nav" data-a="nav" data-v="${k}" ${S.page===k?'aria-current="page"':''}>${t}</button>`).join('');let h;if(S.error)h=`<div class="card err" style="max-width:560px;margin:40px auto"><h2>Couldn’t load email logs</h2><p class="mut">The API request failed (simulated). Check that the ASP.NET Core service is reachable, then retry.</p><button class="btn p" data-a="retry">Retry</button></div>`;else if(S.loading)h=`<div class="top"><div><h1>Loading…</h1></div></div>${'<div class="sk" style="height:96px"></div>'.repeat(3)}<div class="sk" style="height:220px"></div>`;else h=pages[S.page]();$('#app').innerHTML=`<div class="page">${h}</div>`;drawer()}
function refresh(){S.loading=true;render();setTimeout(()=>{S.loading=false;S.ts=Date.now();render()},700)}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&t.dataset.a==='row'&&e.target.closest('#dr'))return;if(e.target.id==='ov'){S.sel=null;drawer();return}if(!t)return;const a=t.dataset.a,v=t.dataset.v;if(a==='nav'){S.page=v;S.sel=null;render()}else if(a==='kpi'){S.status=v;S.pg=1;S.page='logs';render()}else if(a==='row'){S.sel=+v;drawer()}else if(a==='close'){S.sel=null;drawer()}else if(a==='refresh')refresh();else if(a==='sort'){S.sd=S.sk===v?-S.sd:1;S.sk=v;$('#tbl').innerHTML=table()}else if(a==='pg'){S.pg+=+v;$('#tbl').innerHTML=table()}else if(a==='grp'){S.grp=v;render()}else if(a==='wk'){S.inst=v;S.page='logs';render()}else if(a==='err'){S.error=true;S.page='overview';render()}else if(a==='retry'){S.error=false;refresh()}else if(a==='theme'){const r=document.documentElement;r.dataset.theme=(r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches))?'light':'dark'}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const v=e.target.value;if(f==='size'){S.size=+v;S.pg=1;$('#tbl').innerHTML=table();return}S[f]=f==='range'?+v:v;S.pg=1;S.grp='';render()});
document.addEventListener('input',e=>{if(e.target.dataset.f==='q'){S.q=e.target.value;S.pg=1;$('#tbl').innerHTML=table()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sel){S.sel=null;drawer()}if(e.key==='Enter'&&e.target.matches('tr[data-a]'))e.target.click()});
render();
</script></body></html>
